    <!-- Default: light mode always. No flash prevention needed since we hardcode light. -->
    <script>
      // Force light mode as default; respect explicit user preference stored in localStorage
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
